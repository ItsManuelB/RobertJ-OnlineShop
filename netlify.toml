# Netlify build settings. Netlify detects Next.js and runs it with its own
# runtime, so no plugin is installed here. Secrets and keys are set in the
# Netlify dashboard (Site configuration -> Environment variables), never in
# this file - see docs/deployment-netlify.md for the full list.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 needs Node 20.9+; pin it so a Netlify default change can't break the build.
  NODE_VERSION = "22"
